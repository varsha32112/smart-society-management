name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and run the backend tests
        working-directory: backend/society-backend
        run: mvn -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/society-frontend/package-lock.json
      - name: Install, test and build
        working-directory: frontend/society-frontend
        run: |
          npm ci
          npm test -- --no-watch
          npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t society-backend ./backend/society-backend
      - name: Build the frontend image
        run: docker build -t society-frontend ./frontend/society-frontend