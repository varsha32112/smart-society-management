spring.application.name=society-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smart_society
spring.datasource.username=root
spring.datasource.password=root
server.port=${PORT:8081}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyOfAtLeast32Characters2026}
jwt.expiration-ms=86400000
society.public-registration=false
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
society.upi.id=${SOCIETY_UPI_ID:}
society.upi.name=${SOCIETY_UPI_NAME:Smart Society}